
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Championship Registration Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 text-[#11232B]">

    <form class="border-2 border-gray-700 mx-10 my-5 p-8 bg-[#C7EBE3] rounded-lg">

        <h1 class="text-3xl font-bold uppercase text-center">
            School Championship Registration Form
        </h1>

        <hr class="border-gray-700 my-4">
        <hr class="border-gray-700 mb-6">

        <label class="font-semibold">School Name:</label>
        <input type="text"
               id="schoolName"
               name="schoolName"
               placeholder="Enter your School Name"
               class="ml-2 p-2 border border-gray-400 rounded">

        <br><br>

        <label class="font-semibold">Student Name:</label>
        <input type="text"
               id="studentName"
               name="studentName"
               placeholder="Enter your Name"
               class="ml-2 p-2 border border-gray-400 rounded">

        <br><br>

        <label class="font-semibold">Password:</label>
        <input type="password"
               id="pass"
               name="pass"
               placeholder="Enter your password"
               class="ml-2 p-2 border border-gray-400 rounded">

        <br><br>

        <label class="font-semibold">Phone Number:</label>
        <input type="text"
               id="phone"
               name="phone"
               placeholder="Enter your Phone Number"
               class="ml-2 p-2 border border-gray-400 rounded">

        <br><br>

        <label class="font-semibold">Email ID:</label>
        <input type="email"
               id="email"
               name="email"
               placeholder="Enter your Email"
               required
               class="ml-2 p-2 border border-gray-400 rounded">

        <br><br>

        <label class="font-semibold">Preferred Sport:</label>

        <select class="ml-2 p-2 border border-gray-400 rounded">
            <option value="">Select Sport</option>
            <option>Cricket</option>
            <option>Football</option>
            <option>Baseball</option>
            <option>Basketball</option>
            <option>Swimming</option>
        </select>

        <br><br>

        <label class="font-semibold">Gender:</label>

        <input type="radio"
               id="male"
               name="gender"
               class="ml-3">
        <label for="male">Male</label>

        <input type="radio"
               id="female"
               name="gender"
               class="ml-3">
        <label for="female">Female</label>

        <br><br>

        <label class="font-semibold">Parent Permission:</label>

        <input type="radio"
               id="allowed"
               name="parentPermission"
               class="ml-3">
        <label for="allowed">Parent Allowed</label>

        <input type="radio"
               id="notAllowed"
               name="parentPermission"
               class="ml-3">
        <label for="notAllowed">Parent Not Allowed</label>

        <br><br>

        <label class="font-semibold">Date:</label>
        <input type="date"
               class="ml-2 p-2 border border-gray-400 rounded">

        <br><br>

        <label class="font-semibold">Time:</label>
        <input type="time"
               class="ml-2 p-2 border border-gray-400 rounded">

        <br><br>

        <label class="font-semibold">Performer Passport Photo:</label>
        <input type="file"
               class="ml-2 p-2">

        <br><br><br>

        <div class="text-center">

            <input type="submit"
                   value="Submit"
                   class="bg-[#E0F4F1] text-[#40C1AC] font-bold border border-[#40C1AC] px-6 py-2 rounded cursor-pointer hover:bg-[#40C1AC] hover:text-white">

            <input type="reset"
                   value="Reset"
                   class="bg-orange-500 text-white border-0 px-6 py-2 rounded cursor-pointer ml-3 hover:bg-orange-600">

        </div>

    </form>

</body>
</html>
