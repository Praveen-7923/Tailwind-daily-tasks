
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Indusind Bank</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#F5F5DC]">

<div class="border-2 border-[#A52A2A] bg-[#A52A2A] h-[60px] w-full text-white">
<h1 class="text-3xl font-bold">
<span class="bg-white text-[#8B0000] px-8 py-2">Indusind Bank</span>
</h1>
</div>

<form class="p-5">

<div class="border-2 border-[#A52A2A] bg-[#A52A2A] h-[70px] w-full text-white mb-6">
<h2 class="text-2xl font-bold">
<span class="inline-block bg-white text-gray-700 px-8 py-4">
Credit Card
</span>
</h2>
</div>

<h3 class="text-xl font-bold text-[#8B0000] mb-3">
Step1: Provide Your Indusind Bank Credit Card Details
</h3>

<label class="text-gray-800">
Please enter your Indusind Bank credit card number and payment amount
</label>

<hr class="border-dotted border-gray-700 my-4">

<p class="mb-3">
Select Card type. *
</p>

<div class="flex items-center gap-4 mb-5">
<input type="radio" name="one">
<img src="D:\HTML\image\visa - Copy.png" width="20" height="20">

<input type="radio" name="one">
<img src="D:\HTML\image\visa - Copy.png" width="20" height="20">

<input type="radio" name="one">
<img src="D:\HTML\image\visa - Copy.png" width="20" height="20">
</div>

<label>
Enter Indusind Bank Credit Card No *
</label>

<div class="flex gap-2 my-3">
<input type="number" class="border border-gray-500 p-2 w-24">
<input type="number" class="border border-gray-500 p-2 w-24">
<input type="number" class="border border-gray-500 p-2 w-24">
</div>

<label>
Re-Enter Indusind Bank Credit Card No *
</label>

<div class="flex gap-2 my-3">
<input type="number" class="border border-gray-500 p-2 w-24">
<input type="number" class="border border-gray-500 p-2 w-24">
<input type="number" class="border border-gray-500 p-2 w-24">
</div>

<label>Email ID:</label>

<input
type="email"
id="email"
placeholder="Enter your email"
required
class="border border-gray-500 p-2 ml-2">

<br><br>

<label>Phone Number:</label>

<input
type="text"
id="phone"
name="phone"
placeholder="Enter your Phone number"
class="border border-gray-500 p-2 ml-2">

<br><br>

<label>Payment Amount (RS):</label>

<input
type="text"
id="amount"
name="amount"
placeholder="Rupees"
class="border border-gray-500 p-2 ml-2">

<br><br>

<label>
Choose your bank account below and click on 'submit'.
</label>

<hr class="border-dotted border-gray-700 my-4">

<br>

<label>Select bank account:</label>

<select class="border border-gray-500 p-2 ml-2">
<option>State Bank of India</option>
<option>ICICI Bank</option>
<option>IOB Bank</option>
<option>Canara Bank</option>
<option>Bank Of Baroda</option>
<option>Bank Of India</option>
</select>

<br><br><br>

<div class="text-center">

<input
class="bg-[#FF9933] text-[#8B0000] px-5 py-2 border-none cursor-pointer font-bold rounded hover:bg-orange-500"
type="submit"
value="Submit">

</div>

</form>

</body>
</html>
